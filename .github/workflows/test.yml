name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  TYPESCRIPT_HELPERS_REF: 356308eded58a63ca1b942f8a9484a1752d0f4e5
  ATPROTO_MARKET_REF: 56fae8afd0a92c7d2b6d90725021421f378ec027
  HONO_PDS_REF: fa8920306bc4e01b3deea023d3114f6239813f7d
  DID_KEY_INGRESS_PROXY_REF: b616b53056af9062181b897f9c068cef14197619
  ATPROTO_RELAY_REF: 9c26e76c5302ab649b5c681bdf856e2cba0e0023
  POLICY_ENGINE_REF: b8e5cc83d02f9fe8b217d02691e99a1dfc46a4fe
  DENO_WORKER_SANDBOX_REF: a3bbc3f6c64995b78c4ea833a3a75f1a171b460a
  DENO_MACOS_RUNNER_DESKTOP_REF: dc7319fe4ad482ac561ebee4610efca1bcea58e3
  HONO_JSR_REF: 57fcf26de0a1f4fb112fc2c918b5b11f3b796b21
  HONO_COMPUTE_PROVIDER_REF: f640cbe817f5d7b6f191a1cfa80a3b3971cdb237

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publicdomainrelay/socialweb-computer-ssh

    steps:
      - name: Checkout socialweb-computer-ssh
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: publicdomainrelay/socialweb-computer-ssh

      - name: Checkout typescript-helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/typescript-helpers
          ref: ${{ env.TYPESCRIPT_HELPERS_REF }}
          path: publicdomainrelay/typescript-helpers

      - name: Checkout atproto-market
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/atproto-market
          ref: ${{ env.ATPROTO_MARKET_REF }}
          path: publicdomainrelay/atproto-market

      - name: Checkout hono-pds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/hono-pds
          ref: ${{ env.HONO_PDS_REF }}
          path: publicdomainrelay/hono-pds

      - name: Checkout did-key-ingress-proxy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/did-key-ingress-proxy
          ref: ${{ env.DID_KEY_INGRESS_PROXY_REF }}
          path: publicdomainrelay/did-key-ingress-proxy

      - name: Checkout atproto-relay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/atproto-relay
          ref: ${{ env.ATPROTO_RELAY_REF }}
          path: publicdomainrelay/atproto-relay

      - name: Checkout hono-compute-provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/compute-provider-digitalocean
          ref: ${{ env.HONO_COMPUTE_PROVIDER_REF }}
          path: publicdomainrelay/hono-compute-provider

      - name: Checkout policy-engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/policy-engine
          ref: ${{ env.POLICY_ENGINE_REF }}
          path: publicdomainrelay/policy-engine

      - name: Checkout deno-worker-sandbox
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/deno-hono-sandbox
          ref: ${{ env.DENO_WORKER_SANDBOX_REF }}
          path: publicdomainrelay/deno-worker-sandbox

      - name: Checkout deno-macos-runner-desktop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/deno-macos-runner-desktop
          ref: ${{ env.DENO_MACOS_RUNNER_DESKTOP_REF }}
          path: publicdomainrelay/deno-macos-runner-desktop

      - name: Checkout hono-jsr
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: publicdomainrelay/hono-package-registry
          ref: ${{ env.HONO_JSR_REF }}
          path: publicdomainrelay/hono-jsr

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Generated web scope matches the registry
        run: deno run -A scripts/generate-web-scope.ts

      - name: Type-check
        run: deno task check

      - name: Test
        run: deno task test
